[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jitinbraw-gpuops_jd435"
version = "0.1.0"
description = "把输入按语义边界切成独立单元，逐单元核对GPU 集群运维工程师·量化位宽与精度回退相关的特征并标出命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "jitinbraw" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://jitinbraw.github.io"
Repository = "https://github.com/jitinbraw/gpuops_jd435"
Issues = "https://github.com/jitinbraw/gpuops_jd435/issues"

[project.scripts]
gpuops_jd435 = "gpuops_jd435:main"

[tool.setuptools]
py-modules = ["gpuops_jd435"]
